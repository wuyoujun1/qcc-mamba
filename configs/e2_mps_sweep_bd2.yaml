# E2 MPS bond_dim 扫描：bd=2
# NEXT_STEPS.md P1#4：验证 bond_dim=2 大幅压缩损失
experiment: e2_mps_sweep_bd2
dataset: electricity
batch_size: 32
num_workers: 0

split:
  train_ratio: 0.7
  test_ratio: 0.2

model:
  num_var: 321
  d_token: 128
  use_periodic_feat: true
  revin_affine: true

training:
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.0001
  beta: 0.1
  alpha0: 0.1
  seed_base: 2026
  n_seeds: 1

method:
  use_qcc: false
  bond_dim: 2
  kernel_type: rbf

settings:
  - [720, 720]
