# DualAE-QCC 消融实验: 重上传 H/S 交替
# 调制方式敏感性：D=3（首层 H，重上传层 S/H/S 交替），其余与 phase1 相同

# 数据集
dataset: electricity
data_dir: ../ts_quantum/datasets
lookback: 96
horizon: 96

# 模型架构
model:
  d_token: 512
  n_qubits: 10
  n_layers: 3          # D=3 让交替有实际意义（phase1 用 D=2）
  entangle_topo: linear
  kernel_fn: quantum
  use_fmap: true
  alpha0: 0.1
  theta_S_scale0: 0.5
  beta: 0.1
  use_periodic_feat: true
  revin_affine: true

  # 频谱模块（开启）
  use_spectrum: true
  spectrum_M: 32
  spectrum_range: "0_2"
  spectrum_amp_normalize: false
  spectrum_time_align: true
  spectrum_freq_align: true

  # 消融开关：双阶段结构，重上传 H/S 交替
  use_H: true
  use_S: true
  reupload_source: "alternate"

# 训练
train:
  batch_size: 32
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.00001
  proj_weight_decay: 0.0
  use_amp: true
  accumulation_steps: 1
  stride: 1
  num_workers: 4

# 保存
save_dir: results/dual_ablation_reupload_alternate
run_name: dual_reupload_alternate

# 随机种子
seed: 42
