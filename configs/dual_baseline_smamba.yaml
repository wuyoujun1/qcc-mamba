# DualAE-QCC 基线：S-Mamba 原版（无旁路）
# 验证旁路整体贡献：phase1(双阶段) 应 < 本基线

# 数据集
dataset: electricity
data_dir: ../ts_quantum/datasets
lookback: 96
horizon: 96

# 模型架构
model:
  d_token: 512
  n_qubits: 10
  n_layers: 2
  entangle_topo: linear
  kernel_fn: quantum
  use_fmap: true
  alpha0: 0.1
  theta_S_scale0: 0.5
  beta: 0.1
  use_periodic_feat: true
  revin_affine: true

  # 频谱模块（基线关闭）
  use_spectrum: false
  spectrum_M: 32
  spectrum_range: "0_2"
  spectrum_amp_normalize: false
  spectrum_time_align: true
  spectrum_freq_align: true

  # 消融开关：无旁路 = 纯 backbone
  use_H: true
  use_S: false
  use_bypass: false
  reupload_source: "S"

# 训练
train:
  batch_size: 32
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.00001
  proj_weight_decay: 0.0
  use_amp: true
  accumulation_steps: 1
  stride: 1
  num_workers: 4

# 保存
save_dir: results/dual_baseline_smamba
run_name: dual_baseline_smamba

# 随机种子
seed: 42
