# E2 标准 benchmark：新版 feature map（use_full_bloch=True）
experiment: e2_standard_v2
dataset: electricity
batch_size: 32
num_workers: 4

# 数据划分
split:
  train_ratio: 0.7
  test_ratio: 0.2

# 模型通用配置
model:
  num_var: 321
  d_token: 128
  use_periodic_feat: true
  revin_affine: true

# 训练配置
training:
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.0001
  beta: 0.1
  alpha0: 0.1
  seed_base: 2026
  n_seeds: 1

# 方法：只跑量子核（与 run_e1.py 中 quantum 组一致）
method:
  use_qcc: true
  use_fmap: true
  n_qubits: 8
  n_layers: 2
  entangle_topo: linear
  encode_gate: R_Y
  kernel: quantum
  use_full_bloch: true

# 标准 benchmark 设置 (L, H)
settings:
  - [96, 96]
  - [192, 192]
  - [336, 336]
  - [720, 720]
