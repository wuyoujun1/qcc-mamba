# E1 决定性实验配置
# 目标：同一 backbone + 同一旁路结构，仅替换核函数，证明量子核 > 经典核

experiment: e1_kernel_decisive
dataset: electricity
lookback: 720
horizon: 96
batch_size: 32
num_workers: 0

# 数据划分
split:
  train_ratio: 0.7
  test_ratio: 0.2

# 模型通用配置
model:
  num_var: 321
  d_token: 128
  use_periodic_feat: true
  revin_affine: true

# 训练配置
training:
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.0001
  beta: 0.1          # 辅助损失权重
  alpha0: 0.1        # 旁路融合系数初始值
  seed_base: 2026    # seeds = [2026, 2027, 2028]
  n_seeds: 1

# 六组对照（每组只换 kernel）
methods:
  quantum:
    use_qcc: true
    use_fmap: true
    n_qubits: 8
    n_layers: 2
    entangle_topo: linear
    encode_gate: R_Y
    kernel: quantum

  rbf:
    use_qcc: true
    use_fmap: false
    kernel: rbf

  periodic:
    use_qcc: true
    use_fmap: false
    kernel: periodic

  rff:
    use_qcc: true
    use_fmap: false
    kernel: rff
    D_rff: 256

  mps:
    use_qcc: false   # 用 MPSBypass
    bond_dim: 8

  none:
    use_qcc: true
    use_fmap: false
    kernel: none     # 无旁路，α→0 等效
