# E2 weather 基线（S-Mamba 无旁路）
experiment: e2_weather_baseline
dataset: weather
batch_size: 64
num_workers: 4

split:
  train_ratio: 0.7
  test_ratio: 0.2

model:
  num_var: 21
  d_token: 128
  use_periodic_feat: true
  revin_affine: true

training:
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.0001
  beta: 0.1
  alpha0: 0.1
  seed_base: 2026
  n_seeds: 1

method:
  use_qcc: true
  use_fmap: false
  kernel: none

settings:
  - [96, 96]
  - [192, 192]
  - [336, 336]
  - [720, 720]
