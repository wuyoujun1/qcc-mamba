# DualAE-QCC Phase 1: 完整架构（H + S 双阶段）
# 对应文档：IDEA_DualAE_QCC.md §5

# 数据集
dataset: electricity
data_dir: ../ts_quantum/datasets
lookback: 96
horizon: 96

# 模型架构
model:
  d_token: 512
  n_qubits: 10
  n_layers: 2
  entangle_topo: linear
  kernel_fn: quantum
  use_fmap: true
  alpha0: 0.1
  theta_S_scale0: 0.5
  beta: 0.1
  use_periodic_feat: true
  revin_affine: true

  # 频谱模块
  use_spectrum: true
  spectrum_M: 32
  spectrum_range: "0_2"
  spectrum_amp_normalize: false
  spectrum_time_align: true
  spectrum_freq_align: true

  # 消融开关（Phase 1 全开）
  use_H: true
  use_S: true

# 训练
train:
  batch_size: 32
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.00001
  proj_weight_decay: 0.0  # 投影层权重衰减豁免
  use_amp: true
  accumulation_steps: 1
  stride: 1
  num_workers: 4

# 保存
save_dir: results/dual_phase1
run_name: dual_phase1

# 随机种子
seed: 42
