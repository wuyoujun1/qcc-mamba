# E2 MPS bond_dim=4：纠缠能力等价于 QCC(n_qubits=8, n_layers=2)
# 用于论文 Table 1 的理论等价对照
experiment: e2_mps_bd4
dataset: electricity
batch_size: 64
num_workers: 4

split:
  train_ratio: 0.7
  test_ratio: 0.2

model:
  num_var: 321
  d_token: 128
  use_periodic_feat: true
  revin_affine: true

training:
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.0001
  beta: 0.1
  alpha0: 0.3          # 旁路初始权重，C3 建议 0.3-0.5
  seed_base: 2026
  n_seeds: 1

method:
  use_qcc: false
  bond_dim: 4
  kernel_type: rbf

settings:
  - [96, 96]
  - [192, 192]
  - [336, 336]
  - [720, 720]
