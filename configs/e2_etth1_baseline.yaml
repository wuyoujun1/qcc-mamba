# E2 etth1 基线（S-Mamba 无旁路）
experiment: e2_etth1_baseline
dataset: etth1
batch_size: 128
num_workers: 0

split:
  train_ratio: 0.7
  test_ratio: 0.2

model:
  num_var: 7
  d_token: 128
  use_periodic_feat: true
  revin_affine: true

training:
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.0001
  beta: 0.1
  alpha0: 0.1
  seed_base: 2026
  n_seeds: 1

method:
  use_qcc: true
  use_fmap: false
  kernel: none

settings:
  - [96, 96]
  - [192, 192]
  - [336, 336]
  - [720, 720]
