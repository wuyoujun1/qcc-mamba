# E3 超长序列（修正数据划分版）
experiment: e3_longterm
dataset: electricity
batch_size: 16
num_workers: 0

# 60/0/40 二分：训练数据量大，测试集足够长
split:
  train_ratio: 0.60
  test_ratio: 0.40

model:
  num_var: 321
  d_token: 128
  use_periodic_feat: true
  revin_affine: true

training:
  epochs: 100
  patience: 10
  lr: 0.0001
  weight_decay: 0.0001
  beta: 0.1
  alpha0: 0.1
  seed_base: 2026
  n_seeds: 1

method:
  use_qcc: true
  use_fmap: true
  n_qubits: 8
  n_layers: 2
  entangle_topo: linear
  encode_gate: R_Y
  kernel: quantum

settings:
  - [1440, 720]
  - [8760, 720]
